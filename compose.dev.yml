services:
  api:
    working_dir: /app
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8047"
    volumes:
      - ./apps/api:/app
    ports:
      - "8047:8047"
    environment:
      DEBUG: "True"
      FRONTEND_BASE_URL: http://localhost:3047
      CORS_ALLOWED_ORIGINS: http://localhost:3047

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --include=dev && npm run dev -- --hostname 0.0.0.0 --port 3047"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3047:3047"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8047/api
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8047/ws
      HOSTNAME: 0.0.0.0
      PORT: 3047

  db:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

volumes:
  web_node_modules:
  web_next:
