services:
  api:
    environment:
      DEBUG: "False"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8000:8000"

  web:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
