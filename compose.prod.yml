services:
  api:
    environment:
      DEBUG: "False"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8047:8047"

  web:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8047/api
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8047/ws
    ports:
      - "3047:3047"
